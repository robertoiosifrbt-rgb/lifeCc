name: CI

on:
  push:
  pull_request:

# No job ever receives the production database URL or keys. Anything that needs
# a database uses the local Supabase, brought up and shut down in the same job.

jobs:
  verify:
    name: lint, types, tests, build, structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: lint
        run: npm run lint

      - name: typecheck
        run: npm run typecheck

      - name: tests
        run: npm test

      # Deliberately without environment variables: the build must not depend
      # on configuration. It is read at runtime.
      - name: build
        run: npm run build

      - name: structure
        run: npm run check:structure

      # Two gates that see what the five above cannot. A screen can typecheck,
      # test and build and still have no way in; a migration can be clean and
      # still kill the app that is running, because the database and the code
      # do not ship together. Both were written the day they cost something.
      - name: every screen has a door
        run: npm run check:reachable

      # Needs the branch the app is built from, to compare against.
      - name: fetch the deployed branch
        run: git fetch --depth=1 origin main

      - name: no migration breaks the deployed app
        run: npm run check:drops

  local-database:
    name: RLS and layout on a local Supabase
    runs-on: ubuntu-latest
    env:
      CHECK_EMAIL: check@local.test
      CHECK_PASSWORD: password-for-checking-only
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - uses: supabase/setup-cli@v1
        with:
          # Pinned, not latest. A new CLI can change what `supabase start`
          # does or what `supabase status -o env` prints — those names have
          # moved once already — and a red build nobody caused is the most
          # expensive kind: you look for it in the wrong place. It goes up
          # when someone means it, as a commit.
          version: 2.116.0

      - name: local, ephemeral Supabase
        run: supabase start

      - name: the local keys and addresses
        run: |
          eval "$(supabase status -o env)"
          {
            echo "DATABASE_URL=$DB_URL"
            echo "VITE_SUPABASE_URL=$API_URL"
            echo "VITE_SUPABASE_PUBLISHABLE_KEY=${PUBLISHABLE_KEY:-$ANON_KEY}"
            echo "ADMIN_KEY=${SECRET_KEY:-$SERVICE_ROLE_KEY}"
          } >> "$GITHUB_ENV"

      # The most dangerous part of the schema, and the only one whose mistakes
      # do not show up as an ugly screen but as your data read by someone else.
      - name: RLS, negatives and positives
        run: npm run check:rls

      - name: the account the browser checks sign in with
        run: |
          curl -sS --fail-with-body \
            -X POST "$VITE_SUPABASE_URL/auth/v1/admin/users" \
            -H "apikey: $ADMIN_KEY" \
            -H "Authorization: Bearer $ADMIN_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"email\":\"$CHECK_EMAIL\",\"password\":\"$CHECK_PASSWORD\",\"email_confirm\":true}" \
            > /dev/null

      - name: build against the local values
        run: npm run build

      # Both engines. The phone this is written for runs WebKit, and what the
      # application leans on — IndexedDB, downloading a Blob, input type=date,
      # the safe areas — is exactly where engines differ.
      - name: browsers for the browser checks
        run: npx playwright install --with-deps chromium webkit

      # The full cycle from the end of step 5: write a line, process it, tick
      # it, download it, see it on a second device and after a refresh.
      # Not part of `npm test`: it renders the real component in a real page,
      # so it belongs to the job that has browsers, not to the cheap one.
      # Chromium alone — what it proves is the DOM the component produces,
      # which is not where engines differ.
      - name: QuickActionsRow, rendered for real
        run: npm run check:quick-actions-row

      - name: the full cycle, on Chromium
        run: npm run check:cycle

      - name: the full cycle, on WebKit
        env:
          CHECK_BROWSER: webkit
        run: npm run check:cycle

      # It checks the sign-in screen, the screens behind it and both sheets —
      # it signs in through the form, like a person.
      - name: layout at phone width, on Chromium
        run: npm run check:layout

      - name: layout at phone width, on WebKit
        env:
          CHECK_BROWSER: webkit
        run: npm run check:layout

      - name: shut down the local Supabase
        if: always()
        run: supabase stop --no-backup
